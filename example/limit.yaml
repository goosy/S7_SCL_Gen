---
#CPU: AS1       # 指示属于哪一个CPU
#feature: limit # 指示生成 limit 文档

name: AS1-limit # 相当于上面2条被注释的指令

# 额外代码
# 字符串形式指示直接SCL代码，内容将合并输出在 Limit_Loop.SCL 文件中
# includes的内容需要用户自己写，生成程序不检查其中的错误。
includes: ~

symbols: 
# limit文档已有2个内置符号，其内容由本程序自动生成：
# - [Limit_Proc, FB519]  过程值超限判断主处理函数
# - [Limit_Loop, FC519]  主循环调用FC，将这个加入OB1中
# 可以在对上述内置符号的地址进行更改，只要重新定义就可以了，注意保持名称一致

list: # 过程量列表
- comment: 1#储罐液位 # 类型:字符串 省略，省略时为 location + type
  location: 1#储罐    # 类型:字符串 仪表的位置，用于产生报警记录
  type: 液位          # 类型:字符串 仪表的类型，用于产生报警记录

  # Limit_Proc 背景块
  # 类型: S7符号定义 | S7符号引用
  # 没有该项则忽略转换，只输出 comment
  DB: [LIT001,  DB200]

  # 输入值
  # 类型:S7符号定义 | S7符号引用 | SCL表达式
  # 值: REAL
  input: '"tank485".TIT0102'

  # 零点初始值，可省略
  # 类型: null | 浮点数字面量
  $zero: 0

  # 量程初始值，可省略
  # 类型: null | 浮点数字面量
  $span: 14.0

  # 指示过程值是否有效
  # 在485通讯等情况下，可以避免无效的超限判断
  # 类型: null | S7符号定义 | S7符号引用 | SCL表达式
  # 值: BOOL
  invalid: '"tank485".invalid'

  # 允许超限判断初始值
  # $enable_HH $enable_H $enable_L $enable_LL 
  # 类型: null | Bool字面量
  # 通常情况下省略，因为对应 $XX_limit 的值在大部分情况下可指示超限判断启用状态
  $enable_HH: true   # 代表初始时允许HH超限判断，这时必须定义 $HH_limit
  $enable_H: true   # 代表初始时允许H超限判断，这时必须定义 $H_limit
  $enable_L: false  # 代表初始时不允许L超限判断，可以省略定义 $L_limit
  $enable_LL: ~      # 相当于省略，这时由 $LL_limit 决定初始时是否允许LL超限判断

  # 超限值初始值
  # 类型: null | 浮点数字面量
  # 省略或赋值为fasle时，代表该级超限判断不启用。
  # 以下默认了相关超限判断都允许
  $HH_limit: 12.5    # HH超限初始值为12.5
  $H_limit: 12      # H超限初始值为12
  $L_limit: ~       # 没有超限值，等同于省略该项
  $LL_limit: 3.0     # LL超限初始值为3.0，因上方的设置，这里同时也代表初始允许LL超限判断

  # 死区初始值
  # 类型: null | 浮点数字面量
  $dead_zone: 0.2

  # 容错延时，可省略，默认0，即不延时
  # 类型: null | 整数字面量 | TIME字面量
  # 该设置用于过滤过程值的突变，当为整数值时，代表毫秒数
  $FT_time: TIME#10S # 也可以用 100000 这样的整数

- location: 泵进口
  type: 温度
  DB: [TIT0102, DB+] 
  input: [TIT0102_R, PID256]

  # 以下定义了初始时不允许HH超限判断，但设定了HH初始超限值
  $LL_limit: 0.2
  $enable_LL: false

  # (没有$打头的) enable_HH enable_H enable_L enable_LL 用于运行期间的允许超限判断赋值
  # 类型:  null | S7符号定义 | S7符号引用 | S7表达式
  # 值: BOOL
  enable_HH: '"pump485".run_state' # 代表在运行期间，由泵的运行状态决定是否允许HH超限判断
  # 其余的 enable_H enable_L enable_LL 没有定义，代表这3项使能在运行中不改变
  # 一般情况下以上2个只保留一个

- comment: 保留
  # 在有DB块的情况下，会生成 Limit_Proc 背景块和运行期间的 Limit_Proc 调用
  # 没有 DB 则只输出注释，不会生成 Limit_Proc 背景块和运行期间的 Limit_Proc 调用
  DB: [reserve, DB+]

# 用户自写SCL代码，放在循环的开始和结束处。
loop_begin: |-
  // 这里的代码将在 Limit_Loop 循环开始时执行
loop_end: |-
  // 这里的代码将在 Limit_Loop 循环结束时执行

options: # 选项，非必需，无需要时可以全部删除或注释掉。
  # output_file : 'example.scl'

---
